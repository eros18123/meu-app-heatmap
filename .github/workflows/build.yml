name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Instalando Flet
        run: pip install "flet[all]==0.25.2"

      - name: Versoes (guardar para depuracao)
        run: |
          python --version
          flutter --version
          flet --version

      - name: Build APK
        run: flet build apk -v

      - uses: actions/upload-artifact@v4
        with:
          name: App-Heatmap-APK
          path: build/apk/**/*.apk
