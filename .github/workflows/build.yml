name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pegando o seu codigo
        uses: actions/checkout@v4

      - name: Preparando o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preparando o Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Preparando o Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Instalando o Flet (versao fixa)
        run: pip install "flet[all]==0.25.2"

      - name: Construindo o APK
        run: |
          flet build apk -v \
            --android-permissions android.permission.READ_EXTERNAL_STORAGE=True \
                                   android.permission.WRITE_EXTERNAL_STORAGE=True \
                                   android.permission.MANAGE_EXTERNAL_STORAGE=True

      - name: Gerando link de Download
        uses: actions/upload-artifact@v4
        with:
          name: App-Heatmap-APK
          path: build/apk/**/*.apk
