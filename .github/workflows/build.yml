name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pegando o seu código
        uses: actions/checkout@v4

      - name: Preparando o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preparando o motor do Android (Flutter)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalando o Flet
        run: pip install flet

      - name: Transformando em APK (Magia!)
        run: flet build apk

      - name: Gerando o link de Download
        uses: actions/upload-artifact@v4
        with:
          name: App-Heatmap-APK
          path: build/apk/**/*.apk
